name: Build XPI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build XPI
        run: make xpi

      - name: Upload XPI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: '*.xpi'
          if-no-files-found: error

  release:
    # Only create a GitHub Release when a version tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build XPI
        run: make xpi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.xpi'
          generate_release_notes: true

